name: Build Release APK

on:
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions
  push:
    tags:
      - "v*"                # tag v1.2 dst -> otomatis buat GitHub Release + APK

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Runner ubuntu-latest sudah bawa Android SDK (ANDROID_HOME).
      # setup-android@v3 gagal karena coba install paket 'tools' yang sudah
      # tidak ada di cmdline-tools terbaru, jadi cukup terima lisensi saja.
      - name: Accept Android SDK licenses & install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore release ditemukan, APK akan ditandatangani dengan key release."
          else
            echo "Secret KEYSTORE_BASE64 tidak ada, APK ditandatangani dengan debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/GameBoostPro-release-${GITHUB_SHA::7}.apk"
          ls -la dist

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GameBoostPro-release-apk
          path: dist/*.apk

      - name: Publish GitHub Release (hanya saat push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
